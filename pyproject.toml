[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-sieve"
version = "0.1.0"
description = "A personal information filter and email digest pipeline."
requires-python = ">=3.11"
dependencies = [
  "feedparser",
  "httpx",
  "trafilatura",
  "pyyaml",
]

[project.scripts]
stream-sieve = "stream_sieve.launcher:main"

[tool.setuptools.packages.find]
include = ["stream_sieve*"]
