  scoring:
    interests: interests.md
    model: deepseek-v4-flash-0731
    base_url: https://api.openlux.ai/v1/chat/completions
    limit: 50
    prefilter_scan_limit: 500
    prefilter_min_score: 1
    sample_chars: 200
    categories:
    - ai_news
    - tech
    - politics_global
    - politics_china
    - economy_global
    - economy_china
    - society
    - cognition
    nonthink: true
    batch_size: 50
    timeout: 180
    retries: 2
  analysis:
    model: null
    base_url: null
    min_score: 3
    limit: 40
    content_chars: 4000
    batch_size: 5
    nonthink: true
    timeout: 180
    retries: 2
  brief:
    min_score: 3
    limit: 48
    category_limits:
      ai_news: 6
      tech: 6
      politics_global: 6
      politics_china: 6
      economy_global: 6
      economy_china: 6
      society: 6
      cognition: 6
    excerpt_chars: 200
    output: /tmp/stream-sieve-daily-brief.md
  delivery:
    config: configs/delivery.gmail.yaml
    subject: Stream Sieve Daily Brief
  fields:
    ai_news:
      mode: stream
      horizon: 2d
      target_items: 6
      score_limit: 25
      analyze_limit: 8
      prefilter_scan_limit: 120
      prefilter_min_score: 0
      profile: 关注 AI 行业资讯、模型发布、公司动态、产品发布、benchmark、价格变化、开源模型、AI infra 事件和高信号讨论。优先具体新信息，避免泛泛
        AI 评论。
    tech:
      mode: stream
      horizon: 7d
      target_items: 6
      score_limit: 20
      analyze_limit: 8
      prefilter_scan_limit: 80
      prefilter_min_score: 0
      profile: 关注软件工程、云基础设施、开发者工具、系统设计、安全、开源生态、平台变化和非纯 AI 的技术趋势。优先工程含量和结构性变化。
    politics_global:
      mode: stream
      horizon: 3d
      target_items: 6
      score_limit: 20
      analyze_limit: 8
      prefilter_scan_limit: 100
      prefilter_min_score: 0
      profile: 关注国际政治、美国政策、亚太、外交、地缘政治和影响中国的外部政策。优先具体决策、可信报道和政策变化。
    politics_china:
      mode: stream
      horizon: 3d
      target_items: 6
      score_limit: 20
      analyze_limit: 8
      prefilter_scan_limit: 100
      prefilter_min_score: 0
      profile: 关注中国政治、党政体制、对外关系、台海、政策语言、媒体控制和制度变化。优先具体事实和高质量研究。
    economy_global:
      mode: slow_stream
      horizon: 7d
      target_items: 6
      score_limit: 20
      analyze_limit: 8
      prefilter_scan_limit: 100
      prefilter_min_score: 0
      profile: 关注全球经济、宏观数据、金融市场、贸易、财政、货币政策和全球增长。优先数据、政策决定和原始机构材料。
    economy_china:
      mode: slow_stream
      horizon: 7d
      target_items: 6
      score_limit: 20
      analyze_limit: 8
      prefilter_scan_limit: 100
      prefilter_min_score: 0
      profile: 关注中国增长、消费、房地产、信贷、金融系统、贸易、产业政策和外部需求。优先具体数据、政策变化和高质量研究。
    society:
      mode: watchlist
      horizon: 7d
      target_items: 6
      score_limit: 20
      analyze_limit: 8
      prefilter_scan_limit: 80
      prefilter_min_score: 0
      profile: 关注社会重点新闻和尖锐社会矛盾，尤其性别矛盾、家庭/亲子争议、对男性的司法不公、制度性不公、教育、就业、公共安全。优先能揭示结构性问题的事件。
    cognition:
      mode: evergreen
      horizon: evergreen
      target_items: 6
      score_limit: 15
      analyze_limit: 5
      prefilter_scan_limit: 50
      prefilter_min_score: 0
      profile: 关注长期有用的认知、判断、学习、历史、心理、决策、风险、人生策略和解释世界的模型。不追求新闻及时性，优先耐读、能改变思维方式的文章。
