  - {id: nyt-dealbook, path: sources/nyt-dealbook.yaml, sync_limit: 6}
  - {id: barrons-cover, path: sources/barrons-cover.yaml, sync_limit: 6}
  - {id: barrons-up-down-wall-street, path: sources/barrons-up-down-wall-street.yaml, sync_limit: 6}
