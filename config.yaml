run:
  name: daily
  db: ~/.stream-sieve/stream-sieve.db
  source_pool: sourcepool.yaml
  browser_boot:
    enabled: true
    executable: /usr/bin/google-chrome
    user_data_dir: ~/.stream-sieve/chrome-profile
    remote_debugging_port: 9222
    url: about:blank
    startup_wait_seconds: 5
  sources:
  - {id: blog-openai-blog, path: sources/blog-openai-blog.yaml, sync_limit: 12}
  - {id: blog-anthropic-news, path: sources/blog-anthropic-news.yaml, sync_limit: 12}
  - {id: blog-google-deepmind-blog, path: sources/blog-google-deepmind-blog.yaml, sync_limit: 12}
  - {id: blog-hugging-face-blog, path: sources/blog-hugging-face-blog.yaml, sync_limit: 12}
  - {id: qbitai-feed, path: sources/qbitai-feed.yaml, sync_limit: 12}
  - {id: xinzhiyuan, path: sources/xinzhiyuan.yaml, sync_limit: 12}
  - {id: jiqizhixin, path: sources/jiqizhixin.yaml, sync_limit: 12}
  - {id: news-last-week-in-ai, path: sources/news-last-week-in-ai.yaml, sync_limit: 12}
  - {id: blog-microsoft-research-blog, path: sources/blog-microsoft-research-blog.yaml, sync_limit: 16}
  - {id: aws-ml-blog, path: sources/aws-ml-blog.yaml, sync_limit: 16}
  - {id: cloudflare-blog, path: sources/cloudflare-blog.yaml, sync_limit: 16}
  - {id: github-blog, path: sources/github-blog.yaml, sync_limit: 16}
  - {id: news-bytebytego-newsletter, path: sources/news-bytebytego-newsletter.yaml, sync_limit: 16}
  - {id: simon-willison-blog, path: sources/simon-willison-blog.yaml, sync_limit: 16}
  - {id: reuters-asia-pacific-politics, path: sources/reuters-asia-pacific-politics.yaml, sync_limit: 20}
  - {id: reuters-china-politics, path: sources/reuters-china-politics.yaml, sync_limit: 100}
  - {id: reuters-europe-politics, path: sources/reuters-europe-politics.yaml, sync_limit: 20}
  - {id: wsj-politics, path: sources/wsj-politics.yaml, sync_limit: 20}
  - {id: wsj-asia-politics, path: sources/wsj-asia-politics.yaml, sync_limit: 20}
  - {id: wsj-europe-politics, path: sources/wsj-europe-politics.yaml, sync_limit: 20}
  - {id: reuters-business-economy, path: sources/reuters-business-economy.yaml, sync_limit: 34}
  - {id: reuters-markets-economy, path: sources/reuters-markets-economy.yaml, sync_limit: 33}
  - {id: wsj-economy, path: sources/wsj-economy.yaml, sync_limit: 33}
  - {id: wsj-china-economy, path: sources/wsj-china-economy.yaml, sync_limit: 100}
  - {id: x-yantanzhang, path: sources/x-yantanzhang.yaml, sync_limit: 12}
  - {id: x-gulag-bot, path: sources/x-gulag-bot.yaml, sync_limit: 12}
  - {id: x-sager-rgyalpo, path: sources/x-sager-rgyalpo.yaml, sync_limit: 12}
  - {id: x-toronto-bigface, path: sources/x-toronto-bigface.yaml, sync_limit: 12}
  - {id: x-wangjupaian, path: sources/x-wangjupaian.yaml, sync_limit: 12}
  - {id: zhihu-hot, path: sources/zhihu-hot.yaml, sync_limit: 12}
  - {id: zhihu-home, path: sources/zhihu-home.yaml, sync_limit: 50}
  - {id: zhihu-follow, path: sources/zhihu-follow.yaml, sync_limit: 50}
  scoring:
    interests: interests.md
    model: gpt-5.6-luna
    base_url: https://api.openlux.ai/v1/chat/completions
    limit: 50
    prefilter_scan_limit: 500
    prefilter_min_score: 1
    sample_chars: 200
    categories:
    - ai_news
    - tech
    - politics_global
    - politics_china
    - economy_global
    - economy_china
    - society
    - cognition
    nonthink: false
    batch_size: 50
    timeout: 180
    retries: 2
  analysis:
    model: null
    base_url: null
    min_score: 1
    limit: 40
    content_chars: 4000
    batch_size: 5
    nonthink: false
    timeout: 180
    retries: 2
  brief:
    min_score: 1
    limit: 160
    category_limits:
      ai_news: 20
      tech: 20
      politics_global: 20
      politics_china: 20
      economy_global: 20
      economy_china: 20
      society: 20
      cognition: 20
    excerpt_chars: 200
    output: /tmp/stream-sieve-daily-brief.md
  delivery:
    config: configs/delivery.gmail.yaml
    subject: Stream Sieve Daily Brief
  fields:
    ai_news:
      sources: [blog-openai-blog, blog-anthropic-news, blog-google-deepmind-blog, blog-hugging-face-blog, qbitai-feed, xinzhiyuan, jiqizhixin, news-last-week-in-ai]
      mode: stream
      horizon: 1d
      target_items: 20
      score_limit: 100
      analyze_limit: 20
      prefilter_scan_limit: 100
      prefilter_min_score: 0
      profile: 关注 AI 模型、研究、产品、公司、算力、芯片、基础设施、API、价格、开源生态和监管的最新变化，几乎总是优先最近 1 天内的信息。超过 1 天的信息只有在具有重大长期信息价值时才保留。强力去重，过滤普通融资、宣传采访和重复报道。
    tech:
      sources: [blog-microsoft-research-blog, aws-ml-blog, cloudflare-blog, github-blog, news-bytebytego-newsletter, simon-willison-blog]
      mode: stream
      horizon: 7d
      target_items: 20
      score_limit: 100
      analyze_limit: 20
      prefilter_scan_limit: 100
      prefilter_min_score: 0
      profile: 关注软件、硬件、系统、基础设施、开发工具、工程实践和技术研究。优先真正改变性能、成本、能力、可靠性或工程方法的新技术、架构、工具、论文、benchmark 和实现经验。过滤营销、小版本更新和没有技术含量的科技新闻。
    politics_global:
      sources: [reuters-asia-pacific-politics, reuters-europe-politics, wsj-politics, wsj-asia-politics, wsj-europe-politics]
      mode: stream
      horizon: 3d
      target_items: 20
      score_limit: 100
      analyze_limit: 20
      prefilter_scan_limit: 100
      prefilter_min_score: 0
      profile: 关注美国、欧洲和亚太的权力、制度、规则、资源分配和利益结构变化。优先政策、法律、监管、任命、国际关系、移民、教育、科研、科技、金融和资本流动中会改变现实机会或风险的信息。过滤党派口水、人物八卦、象征性争议和空洞表态。
    politics_china:
      sources: [reuters-china-politics]
      mode: stream
      horizon: 3d
      target_items: 20
      score_limit: 100
      analyze_limit: 20
      prefilter_scan_limit: 100
      prefilter_min_score: 0
      profile: 关注中国政治、党政体制、对外关系、台海、政策语言、媒体控制和制度变化。优先具体事实、政策决定、可信报道和高质量研究。
    economy_global:
      sources: [reuters-business-economy, reuters-markets-economy, wsj-economy]
      mode: slow_stream
      horizon: 7d
      target_items: 20
      score_limit: 100
      analyze_limit: 20
      prefilter_scan_limit: 100
      prefilter_min_score: 0
      profile: 关注美国、欧洲和全球经济中会改变财富、就业、投资、融资、购买力和未来选择的变化。优先货币政策、利率、通胀、就业、信用、流动性、房地产、银行、汇率、资本流动和产业结构变化。过滤日常行情噪声、泛泛评论和无证据预测。
    economy_china:
      sources: [wsj-china-economy]
      mode: slow_stream
      horizon: 7d
      target_items: 20
      score_limit: 100
      analyze_limit: 20
      prefilter_scan_limit: 100
      prefilter_min_score: 0
      profile: 关注中国增长、消费、房地产、信贷、金融系统、贸易、产业政策和外部需求。优先具体数据、政策变化和高质量研究。
    society:
      sources: [x-yantanzhang, x-gulag-bot, x-sager-rgyalpo, x-toronto-bigface, x-wangjupaian, zhihu-hot]
      mode: watchlist
      horizon: 7d
      target_items: 20
      score_limit: 100
      analyze_limit: 20
      prefilter_scan_limit: 100
      prefilter_min_score: 0
      profile: 关注中国社会现状及其高信号讨论，包括激烈矛盾、群体冲突、制度摩擦、利益不对称、生活处境、行为变化和思潮变化。重点关注男女矛盾、婚恋、彩礼、离婚、财产、生育、性指控争议、诬告争议、司法或机构处理差异，以及男性去责任化、退出婚姻、性别不信任等社会思潮。过滤娱乐和网红八卦，除非它们反映更大的社会矛盾。
    cognition:
      sources: [zhihu-home, zhihu-follow]
      mode: evergreen
      horizon: evergreen
      target_items: 20
      score_limit: 100
      analyze_limit: 20
      prefilter_scan_limit: 100
      prefilter_min_score: 0
      profile: 关注能长期改善思考、判断、学习、策略、自我认知和理解人性的内容。优先 mental models、概率、博弈、激励、行为经济学、谈判、权力、策略、学习方法、职业资本和可复用的人性机制。旧文章只要信息价值高，完全可以高于当天新内容。
