  - {id: wsj-economy, path: sources/wsj-economy.yaml, sync_limit: 6}
  - {id: wsj-heard-on-the-street, path: sources/wsj-heard-on-the-street.yaml, sync_limit: 6}
  - {id: wsj-capital-account-econ, path: sources/wsj-capital-account-econ.yaml, sync_limit: 6}
