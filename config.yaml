  - {id: caixin-economy, path: sources/caixin-economy.yaml, sync_limit: 10}
  - {id: caixin-finance, path: sources/caixin-finance.yaml, sync_limit: 10}
  - {id: nikkei-economy, path: sources/nikkei-economy.yaml, sync_limit: 10}
  - {id: nikkei-business, path: sources/nikkei-business.yaml, sync_limit: 10}
